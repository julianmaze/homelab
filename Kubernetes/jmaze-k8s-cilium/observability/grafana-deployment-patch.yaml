apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: observability
spec:
  template:
    spec:
      containers:
        - name: grafana
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
            requests:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - mountPath: /grafana-dashboard-definitions/0/coredns
              name: grafana-dashboard-coredns
              readOnly: false
      volumes:
        - configMap:
            name: grafana-dashboard-coredns
          name: grafana-dashboard-coredns
