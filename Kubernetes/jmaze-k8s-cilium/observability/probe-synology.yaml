# Synology DS1522 (100.100.109.32) blackbox probes: ICMP, TCP ports, HTTP health.
# Probes are picked up by Prometheus automatically (probeSelector: {}).
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: ds1522-icmp
  namespace: observability
  labels:
    app.kubernetes.io/part-of: synology-monitoring
    nas: ds1522
spec:
  jobName: synology-icmp
  interval: 30s
  scrapeTimeout: 10s
  module: icmp
  prober:
    url: blackbox-exporter.observability.svc:19115
  targets:
    staticConfig:
      static:
        - 100.100.109.32
      labels:
        nas: ds1522
        service: icmp
---
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: ds1522-tcp
  namespace: observability
  labels:
    app.kubernetes.io/part-of: synology-monitoring
    nas: ds1522
spec:
  jobName: synology-tcp
  interval: 30s
  scrapeTimeout: 10s
  module: tcp_connect
  prober:
    url: blackbox-exporter.observability.svc:19115
  targets:
    staticConfig:
      static:
        - 100.100.109.32:22
        - 100.100.109.32:2049
        - 100.100.109.32:5000
        - 100.100.109.32:5001
        - 100.100.109.32:5080
      labels:
        nas: ds1522
      relabelingConfigs:
        # Friendly "port" label derived from the target
        - sourceLabels: [__param_target]
          regex: '.*:(\d+)'
          targetLabel: port
          replacement: '$1'
---
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: ds1522-http
  namespace: observability
  labels:
    app.kubernetes.io/part-of: synology-monitoring
    nas: ds1522
spec:
  jobName: synology-http
  interval: 30s
  scrapeTimeout: 15s
  module: http_2xx_insecure
  prober:
    url: blackbox-exporter.observability.svc:19115
  targets:
    staticConfig:
      static:
        - http://100.100.109.32:5000
        - https://100.100.109.32:5001
        - http://100.100.109.32:5080
      labels:
        nas: ds1522
      relabelingConfigs:
        - sourceLabels: [__param_target]
          regex: '.*:(\d+)/?'
          targetLabel: port
          replacement: '$1'
---
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: ds1522-ssh
  namespace: observability
  labels:
    app.kubernetes.io/part-of: synology-monitoring
    nas: ds1522
spec:
  jobName: synology-ssh
  interval: 60s
  scrapeTimeout: 10s
  module: ssh_banner
  prober:
    url: blackbox-exporter.observability.svc:19115
  targets:
    staticConfig:
      static:
        - 100.100.109.32:22
      labels:
        nas: ds1522
        service: ssh-banner
