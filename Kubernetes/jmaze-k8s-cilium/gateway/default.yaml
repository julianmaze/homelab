---
# This is the default gateway for the cluster. It is used to route traffic to a variety of services that can be co-located behind the same load balancer.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: default-gateway
  namespace: gateway # custom namespace for gateways
  annotations:
    cert-manager.io/cluster-issuer: cloudflare
spec:
  gatewayClassName: cilium
  listeners:
    # HTTP redirect to HTTPS
    - protocol: HTTP
      port: 80
      name: https-redirect
      allowedRoutes:
        kinds:
          - kind: HTTPRoute
            group: gateway.networking.k8s.io
    # Media services
    - protocol: HTTPS
      port: 443
      name: media
      hostname: "*.media.jmaz.tv"
      tls:
        mode: Terminate # Terminate TLS at the gateway
        certificateRefs:
          - name: wildcard-media-jmaz-tv-tls
      allowedRoutes:
        kinds:
          - kind: HTTPRoute
            group: gateway.networking.k8s.io
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: media
    # UHD Media services
    - protocol: HTTPS
      port: 443
      name: media-uhd
      hostname: "*.uhd.media.jmaz.tv"
      tls:
        mode: Terminate # Terminate TLS at the gateway
        certificateRefs:
          - name: wildcard-media-jmaz-tv-tls
      allowedRoutes:
        kinds:
          - kind: HTTPRoute
            group: gateway.networking.k8s.io
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: media
    # unifi.local.julianmaze.com
    # KNOWN BROKEN as of Cilium 1.19.4: this listener is correctly configured
    # (verified against cilium/cilium#45693's fix) but the TLSRoute attached to
    # it is rejected with "NotAllowedByListeners" due to a Cilium bug where
    # allowedRoutes namespace/kind restrictions misbehave on multi-listener
    # Gateways (this Gateway has 10+ listeners). See cilium/cilium#45559 and
    # #42159, fixed by cilium/cilium#45693, backported + released in v1.19.6
    # (2026-07-16). Upgrade cilium to >=1.19.6 to restore unifi access via
    # this Gateway. Direct access still works via the LoadBalancer Service
    # (unifi.unifi ClusterIP / 10.50.25.3:8443) in the meantime.
    # Deliberately holding off on this upgrade for now (see unifi/README.md) -
    # note it does NOT get us gateway-terminated SSL anyway, since that also
    # requires BackendTLSPolicy support, which needs Cilium 1.20 (not yet GA).
    - protocol: TLS
      port: 443
      name: unifi
      hostname: "unifi.local.julianmaze.com"
      tls:
        mode: Passthrough # TLS is handled by the unifi application (self-signed cert)
      allowedRoutes:
        kinds:
          - kind: TLSRoute
            group: gateway.networking.k8s.io
        namespaces:
          from: Selector
          selector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values:
                  - unifi
    # local.julianmaze.com
    - protocol: HTTPS
      port: 443
      name: local-subdomain
      hostname: "*.local.julianmaze.com"
      tls:
        mode: Terminate # Terminate TLS at the gateway
        certificateRefs:
          - name: wildcard-local-julianmaze-com-tls
      allowedRoutes:
        kinds:
          - kind: HTTPRoute
            group: gateway.networking.k8s.io
        namespaces:
          from: Selector
          selector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values:
                  - longhorn-system
                  - development
                  - unifi
                  - kube-system
                  - observability
                  - external-services
    # home assistant public
    - protocol: HTTPS
      port: 443
      name: home-assistant-public
      hostname: "home.julianmaze.com"
      tls:
        mode: Terminate # Terminate TLS at the gateway
        certificateRefs:
          - name: home-julianmaze-com-tls
      allowedRoutes:
        kinds:
          - kind: HTTPRoute
            group: gateway.networking.k8s.io
        namespaces:
          from: Selector
          selector:
            # There should be multiple here
            matchLabels:
              kubernetes.io/metadata.name: external-services
    # scrypted home public
    - protocol: HTTPS
      port: 443
      name: scrypted-home-public
      hostname: "scrypted-home.julianmaze.com"
      tls:
        mode: Terminate # Terminate TLS at the gateway
        certificateRefs:
          - name: scrypted-home-julianmaze-com-tls
      allowedRoutes:
        kinds:
          - kind: HTTPRoute
            group: gateway.networking.k8s.io
        namespaces:
          from: Selector
          selector:
            # There should be multiple here
            matchLabels:
              kubernetes.io/metadata.name: external-services
    # storage.jmaz.tv
    - protocol: HTTPS
      port: 443
      name: storage-jmaz-tv
      hostname: "storage.jmaz.tv"
      tls:
        mode: Terminate # Terminate TLS at the gateway
        certificateRefs:
          - name: storage-jmaz-tv-tls
      allowedRoutes:
        kinds:
          - kind: HTTPRoute
            group: gateway.networking.k8s.io
        namespaces:
          from: Selector
          selector:
            # There should be multiple here
            matchLabels:
              kubernetes.io/metadata.name: external-services
    # photos.jmaz.tv
    - protocol: HTTPS
      port: 443
      name: photos-jmaz-tv
      hostname: "photos.jmaz.tv"
      tls:
        mode: Terminate # Terminate TLS at the gateway
        certificateRefs:
          - name: photos-jmaz-tv-tls
      allowedRoutes:
        kinds:
          - kind: HTTPRoute
            group: gateway.networking.k8s.io
        namespaces:
          from: Selector
          selector:
            # There should be multiple here
            matchLabels:
              kubernetes.io/metadata.name: external-services
    # surfcam.julianmaze.com
    - protocol: HTTPS
      port: 443
      name: surfcam-redirect
      hostname: "surfcam.julianmaze.com"
      tls:
        mode: Terminate # Terminate TLS at the gateway
        certificateRefs:
          - name: surfcam-julianmaze-com-tls
      allowedRoutes:
        kinds:
          - kind: HTTPRoute
            group: gateway.networking.k8s.io
        namespaces:
          from: Same
    # overseerr.jmaz.tv
    - protocol: HTTPS
      port: 443
      name: overseerr
      hostname: "overseerr.jmaz.tv"
      tls:
        mode: Terminate # Terminate TLS at the gateway
        certificateRefs:
          - name: overseerr-jmaz-tv-tls
      allowedRoutes:
        kinds:
          - kind: HTTPRoute
            group: gateway.networking.k8s.io
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: media
