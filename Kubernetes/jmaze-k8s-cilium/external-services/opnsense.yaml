---
kind: Service
apiVersion: v1
metadata:
  name: opnsense
  namespace: external-services
spec:
  ports:
    - name: http
      port: 80
      targetPort: 80
    - name: https
      port: 443
      targetPort: 443
    - name: ssh
      port: 22
      targetPort: 22
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: opnsense
  namespace: external-services
  labels:
    kubernetes.io/service-name: opnsense
addressType: IPv4
endpoints:
  - addresses:
      - 10.50.1.1
    conditions:
      ready: true
ports:
  - name: http
    port: 80
  - name: https
    port: 443
  - name: ssh
    port: 22