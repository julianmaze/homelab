---
kind: Service
apiVersion: v1
metadata:
  name: ds-1522
  namespace: external-services
spec:
  ports:
    - name: console
      port: 5000
      targetPort: 5000
    - name: photos
      port: 5080
      targetPort: 5080
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: ds-1522
  namespace: external-services
  labels:
    kubernetes.io/service-name: ds-1522
addressType: IPv4
endpoints:
  - addresses:
      - 100.100.109.32
    conditions:
      ready: true
ports:
  - name: console
    port: 5000
  - name: photos
    port: 5080
---
apiVersion: cilium.io/v2
kind: CiliumEnvoyConfig
metadata:
  name: extend-vpn-connect-timeout
  namespace: external-services
spec:
  # Instruct Cilium to modify the existing backend cluster routing
  resources:
    - "@type": type.googleapis.com/envoy.config.cluster.v3.Cluster
      name: "external-services/ds-1522" # Format: <namespace>/<your-kubernetes-service-name>
      type: EDS
      # --- Extends the strict connection window ---
      connectTimeout: 30s
      dnsLookupFamily: V4_ONLY
      outlierDetection:
        splitExternalLocalOriginErrors: true
