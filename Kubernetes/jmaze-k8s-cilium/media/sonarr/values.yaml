global:
  fallbackDefaults:
    probeTimeouts:
      liveness:
        timeoutSeconds: 30
        periodSeconds: 120
      readiness:
        timeoutSeconds: 30
        periodSeconds: 120

# Disable the metrics service
service:
  metrics:
    enabled: false

# Disable the exportarr container
workload:
  main:
    podSpec:
      affinity:
        # Needed in order to seperate what node Sonarr and radarr are deployed on
        podAffinity:
      containers:
        main:
          resources:
            requests:
              cpu: 1000m
              memory: 2048Mi
            limits:
              cpu: 4000m
              memory: 8192Mi
        exportarr:
          enabled: false

# Overload values for persistence here to mount our media pvc
persistence:
  config:
    enabled: true
    existingClaim: sonarr
    targetSelector:
      main:
        main:
          mountPath: /config
  media:
    enabled: true
    existingClaim: ds1522-media
    mountPath: "/media"

# Disabling metrics - we do not have a Prometheus instance set up yet.
metrics:
  main:
    enabled: false

# Setting node affinity to handle 1 replica longhorn volume for improved IOPS on DB
podOptions:
  nodeSelector:
    kubernetes.io/hostname: k3s-cilium-3

# Setting fsGroup on the pod security policy to root to avoid a chown recursive action on the NFS media mounts
# NOTE: the /volume1/media mount also needs 2777 permissions to avoid the kubectl exec chown recursive action on the NFS media mounts
securityContext:
  pod:
    fsGroup: 0
